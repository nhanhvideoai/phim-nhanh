plugins { id 'com.android.application' }

def vc = Integer.parseInt((project.findProperty('vc') ?: '1').toString())
def vn = (project.findProperty('vn') ?: '1.0.0').toString()

android {
  namespace 'com.nhanh.phim'
  compileSdk 34
  defaultConfig {
    applicationId 'com.nhanh.phim'
    minSdk 26
    targetSdk 34
    versionCode vc
    versionName vn
  }
  signingConfigs {
    release {
      def ks = file('release.jks')
      if (ks.exists()) {
        storeFile ks
        storePassword System.getenv('KS_PASS')
        keyAlias 'lichnhanh'
        keyPassword System.getenv('KS_PASS')
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
}
