name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        env:
          KS_PASS: 'lichnhanh-tPPEPGmt3sm'
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }} -Pvn=1.0.${{ github.run_number }} 2>&1 | tee build.log

      - name: Báo lỗi build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "error:|e: |What went wrong|\.java:[0-9]+" -A3 build.log | head -80 > loi.txt || true
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat loi.txt)" 

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk phim-nhanh-1.0.${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Phím Nhanh 1.0.${{ github.run_number }}
          body: Bản tự động từ lần cập nhật ${{ github.sha }}
          files: phim-nhanh-1.0.${{ github.run_number }}.apk
          make_latest: true
