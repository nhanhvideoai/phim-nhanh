<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#fff" stop-opacity=".25"/><stop offset=".7" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#fff6c9"/><stop offset=".45" stop-color="#ffd25e"/><stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#cfe6ff" stop-opacity=".7"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0a0f30" flood-opacity=".45"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- phím kính -->
  <g filter="url(#sh)">
    <rect x="292" y="292" width="440" height="440" rx="112" fill="url(#card)"/>
    <rect x="294" y="294" width="436" height="436" rx="110" fill="none" stroke="url(#rim)" stroke-width="6"/>
    <rect x="318" y="312" width="388" height="120" rx="60" fill="#fff" opacity=".14"/>
  </g>
  <!-- nút cạnh máy -->
  <rect x="756" y="372" width="22" height="120" rx="11" fill="url(#btn)"/>
  <rect x="756" y="520" width="22" height="78" rx="11" fill="url(#btn)" opacity=".85"/>
  <!-- tia chớp -->
  <path filter="url(#glow)" fill="url(#bolt)" d="M548 352 L418 540 L498 540 L470 676 L612 470 L528 470 L566 352 Z"/>
</svg>
